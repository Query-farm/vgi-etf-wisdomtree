# Private grader sidecar for `vgi-lint simulate` (and `lint`'s VGI520 coverage). The worker
# publishes only task names + prompts in `vgi.agent_test_tasks` (src/catalog.ts); these
# grader fields are keyed by that name and never sent to the analyst agent.
#
# Agent-suitability suite (catalog only). Each task carries a deterministic check_sql that
# asserts specific ground truth; reference_sql is deliberately omitted (live data). One task per
# callable surface (products, holdings table, holdings() scan) satisfies VGI520.
tasks:
  - name: "dgrw_exists"
    check_sql: "SELECT count(*) > 0 FROM wisdomtree.main.products WHERE ticker = 'DGRW'"
    success_criteria: "The answer confirms DGRW is the WisdomTree U.S. Quality Dividend Growth Fund, found via the products table."

  - name: "equity_funds"
    check_sql: "SELECT count(*) > 0 FROM wisdomtree.main.products WHERE asset_class = 'Domestic Equity'"
    success_criteria: "The answer names several domestic-equity WisdomTree ETFs from the products table."

  - name: "dgrw_top_holding"
    check_sql: "SELECT count(*) > 0 FROM wisdomtree.main.holdings WHERE fund_ticker = 'DGRW'"
    success_criteria: "The answer names DGRW's top holding by weight, obtained from the holdings table."

  - name: "dgrw_holdings_scan"
    check_sql: "SELECT count(*) > 0 FROM wisdomtree.main.holdings() WHERE fund_ticker = 'DGRW'"
    success_criteria: "The answer returns DGRW constituents via the holdings() backing scan function filtered by fund_ticker."

  # Composed (products × holdings): the agent saves its answer in a temp table; the check_sql
  # recomputes the live truth and compares, so a wrong answer fails.
  - name: "domestic_equity_top_holdings"
    check_sql: >-
      WITH truth AS (
        SELECT p.ticker AS fund_ticker, h.ticker
        FROM wisdomtree.main.products p
        JOIN wisdomtree.main.holdings h ON h.fund_ticker = p.ticker
        WHERE p.asset_class = 'Domestic Equity'
        QUALIFY row_number() OVER (PARTITION BY p.ticker ORDER BY h.weight_percent DESC NULLS LAST) = 1
      )
      SELECT (SELECT count(*) FROM truth) > 0
      AND (SELECT count(*) FROM top_holdings) = (SELECT count(*) FROM truth)
      AND NOT EXISTS (
        SELECT 1 FROM truth t
        LEFT JOIN top_holdings a
          ON upper(trim(a.fund_ticker)) = t.fund_ticker
          AND upper(trim(a.ticker)) = t.ticker
        WHERE a.fund_ticker IS NULL
      )
    success_criteria: "The answer gives, for each Domestic Equity fund in the products table, its top holding by weight from the holdings table, saved in top_holdings."
